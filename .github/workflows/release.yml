name: Publish Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
      source_sha: ${{ steps.source.outputs.commit }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Validate tag, version and release notes
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          properties = dict(
              line.strip().split('=', 1)
              for line in Path('gradle.properties').read_text().splitlines()
              if '=' in line and not line.lstrip().startswith('#')
          )
          version = properties['flowa.versionName']
          code = properties['flowa.versionCode']
          if not re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', version):
              raise SystemExit('versionName must be major.minor.patch')
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('Tag does not match flowa.versionName')
          if not re.fullmatch(r'[1-9][0-9]{0,9}', code) or int(code) > 2100000000:
              raise SystemExit('Invalid Android versionCode')
          notes = Path(f'docs/releases/v{version}.md')
          if not notes.is_file() or not notes.read_text().strip():
              raise SystemExit('Version release notes are missing')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version_name={version}\nversion_code={code}\n')
          PY

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install Android SDK dependencies
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            'platforms;android-35' 'build-tools;34.0.0' 'build-tools;35.0.0'

      - name: Run unit tests and release lint
        run: >-
          ./gradlew :core:domain:test :app:testReleaseUnitTest :app:lintRelease
          --no-daemon --max-workers=2

      - name: Enable KVM for the cloud test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run isolated device regression on the cloud emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          avd-name: flowa-release-test
          disable-animations: false
          script: ./gradlew :app:connectedDebugAndroidTest -PisolatedUiTest=true --max-workers=2

      - name: Save test and lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports-${{ github.run_id }}
          path: |
            app/build/reports/
            core/domain/build/reports/tests/
          if-no-files-found: warn
          retention-days: 7

      - name: Restore normal builds and produce unsigned release
        run: >-
          ./gradlew :app:assembleDebug :app:assembleRelease :app:bundleRelease
          --no-daemon --max-workers=2

      - name: Prepare unsigned artifacts and corresponding source
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/flowa-debug-badging.txt"
          grep -F "package: name='com.flowa.app' " "$RUNNER_TEMP/flowa-debug-badging.txt"
          mkdir -p dist/unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk dist/unsigned/
          cp app/build/outputs/bundle/release/app-release.aab dist/unsigned/
          cp "docs/releases/$RELEASE_TAG.md" dist/unsigned/release-notes.md
          git archive --format=tar.gz --prefix="flowa-$RELEASE_TAG/" \
            --output="dist/unsigned/flowa-$RELEASE_TAG-sources.tar.gz" HEAD

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-release-${{ github.run_id }}
          path: dist/unsigned/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      VERSION_NAME: ${{ needs.build.outputs.version_name }}
      VERSION_CODE: ${{ needs.build.outputs.version_code }}
      SOURCE_SHA: ${{ needs.build.outputs.source_sha }}
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android signing tools
        run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-release-${{ github.run_id }}
          path: unsigned

      - name: Sign APK and AAB with the existing Mobby key
        shell: bash
        env:
          MOBBY_RELEASE_KEYSTORE_BASE64: ${{ secrets.MOBBY_RELEASE_KEYSTORE_BASE64 }}
          MOBBY_RELEASE_STORE_PASSWORD: ${{ secrets.MOBBY_RELEASE_STORE_PASSWORD }}
          MOBBY_RELEASE_KEY_ALIAS: ${{ secrets.MOBBY_RELEASE_KEY_ALIAS }}
          MOBBY_RELEASE_KEY_PASSWORD: ${{ secrets.MOBBY_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${MOBBY_RELEASE_KEYSTORE_BASE64:?Missing keystore secret}"
          : "${MOBBY_RELEASE_STORE_PASSWORD:?Missing store password}"
          : "${MOBBY_RELEASE_KEY_ALIAS:?Missing key alias}"
          : "${MOBBY_RELEASE_KEY_PASSWORD:?Missing key password}"
          trap 'rm -f "$RUNNER_TEMP/mobby-release.keystore"' EXIT
          umask 077
          printf '%s' "$MOBBY_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mobby-release.keystore"
          mkdir -p release-assets
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$RUNNER_TEMP/mobby-release.keystore" \
            --ks-key-alias "$MOBBY_RELEASE_KEY_ALIAS" \
            --ks-pass env:MOBBY_RELEASE_STORE_PASSWORD \
            --key-pass env:MOBBY_RELEASE_KEY_PASSWORD \
            --out "release-assets/flowa-$RELEASE_TAG.apk" unsigned/app-release-unsigned.apk
          jarsigner -keystore "$RUNNER_TEMP/mobby-release.keystore" \
            -storepass:env MOBBY_RELEASE_STORE_PASSWORD \
            -keypass:env MOBBY_RELEASE_KEY_PASSWORD \
            -signedjar "release-assets/flowa-$RELEASE_TAG.aab" \
            unsigned/app-release.aab "$MOBBY_RELEASE_KEY_ALIAS"

      - name: Verify signed packages and prepare checksums
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/35.0.0"
          apk="release-assets/flowa-$RELEASE_TAG.apk"
          aab="release-assets/flowa-$RELEASE_TAG.aab"
          "$tools/apksigner" verify --verbose --print-certs "$apk" > release-assets/signing-certificate.txt
          grep -Fx 'Signer #1 certificate SHA-256 digest: b9c0f6d84ce69044208f2aa08b7f9f02125fb7f75b1c780c9651cc2a0414d8b5' release-assets/signing-certificate.txt
          "$tools/zipalign" -c 4 "$apk"
          "$tools/aapt" dump badging "$apk" > "$RUNNER_TEMP/flowa-badging.txt"
          grep -F "package: name='com.flowa.app' versionCode='$VERSION_CODE' versionName='$VERSION_NAME'" "$RUNNER_TEMP/flowa-badging.txt"
          if grep -q '^application-debuggable' "$RUNNER_TEMP/flowa-badging.txt"; then
            echo 'Refusing to publish a debuggable APK'
            exit 1
          fi
          jarsigner -verify "$aab"
          keytool -J-Duser.language=en -printcert -jarfile "$aab" > "$RUNNER_TEMP/flowa-aab-certificate.txt"
          grep -F 'SHA256: B9:C0:F6:D8:4C:E6:90:44:20:8F:2A:A0:8B:7F:9F:02:12:5F:B7:F7:5B:1C:78:0C:96:51:CC:2A:04:14:D8:B5' "$RUNNER_TEMP/flowa-aab-certificate.txt"
          cp "unsigned/flowa-$RELEASE_TAG-sources.tar.gz" release-assets/
          (cd release-assets && sha256sum *.apk *.aab *-sources.tar.gz signing-certificate.txt > SHA256SUMS.txt)

      - name: Publish GitHub Release after uploading all assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          remote_sha=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
          if [[ "$remote_sha" != "$SOURCE_SHA" ]]; then
            echo 'Version tag changed during the build; refusing to publish stale artifacts'
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/flowa-release-draft.txt" 2>/dev/null; then
            if [[ "$(cat "$RUNNER_TEMP/flowa-release-draft.txt")" != true ]]; then
              echo 'This release is already public; publish a new version instead'
              exit 1
            fi
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft \
              --title "随心记 Android $VERSION_NAME" --notes-file unsigned/release-notes.md
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest \
            --title "随心记 Android $VERSION_NAME" --notes-file unsigned/release-notes.md

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/mobby-release.keystore"
